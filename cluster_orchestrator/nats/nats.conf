# NATS with MQTT compatibility - drop-in replacement for Mosquitto in Oakestra.
server_name: oakestra-cluster-nats

# JetStream is REQUIRED for MQTT (QoS 1 delivery + MQTT session state).
jetstream {
  store_dir: "/data"
  max_memory_store: 256MB
  max_file_store: 1GB
}

# MQTT listener on the same port Mosquitto used (10003).
# No authorization block => anonymous access (matches mosquitto allow_anonymous true).
mqtt {
  port: 10003
}

# HTTP monitoring endpoint for health/diagnostics (exposes /healthz on 8222).
http: 8222
